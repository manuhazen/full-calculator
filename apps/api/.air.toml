root = "."
tmp_dir = "tmp"
[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", ".git"]
delay = 500
poll = true
poll_interval = 500
send_interrupt = true
kill_delay = "2s"
stop_on_error = true
[log]
time = true
[misc]
clean_on_exit = true
